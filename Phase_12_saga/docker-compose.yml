# OLD CONFIG (commented out) — why this was not good enough:
# `depends_on` as a plain list (e.g. `depends_on: - config-server`) ONLY waits for the config-server CONTAINER to start. It does NOT check whether the
# Spring Boot application inside that container has actually finished booting and is listening on its port.

# Fix: use a `healthcheck` (hits /actuator/health) + `depends_on` with `condition: service_healthy`,
# so dependent services wait until the app inside the container is actually ready, not just until the container  process has started. See the active config below.
# ============================================================================

