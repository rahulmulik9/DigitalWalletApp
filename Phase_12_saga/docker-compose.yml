# ============================================================================
# NEW CONFIG (active) — waits for actual app health, not just container start
# ============================================================================

services:
  account-db:
    image: postgres:18
    container_name: account-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: AccountService
    ports:
      - "5433:5432"
    volumes:
      - account_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d AccountService"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  transaction-db:
    image: postgres:18
    container_name: transaction-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: TransactionService
    ports:
      - "5434:5432"
    volumes:
      - transaction_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d TransactionService"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  monitoring-db:
    image: postgres:18
    container_name: monitoring-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: MonitoringService
    ports:
      - "5435:5432"
    volumes:
      - monitoring_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d MonitoringService"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  notification-db:
    image: postgres:18
    container_name: notification-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: NotificationService
    ports:
      - "5436:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d NotificationService" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
