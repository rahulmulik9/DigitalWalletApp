spring:
  application:
    name: DigitalWallet

  datasource:
    url: jdbc:postgresql://localhost:5432/DigitalWallet
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug