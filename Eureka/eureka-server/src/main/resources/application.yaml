server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # this instance IS the registry — don't register with itself, don't fetch a registry
    register-with-eureka: false
    fetch-registry: false
  server:
    # dev-friendly: evict dead instances fast instead of waiting ~90s self-preservation window
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000