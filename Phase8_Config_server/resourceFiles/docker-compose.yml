services:
  account-db:
    image: postgres:18
    container_name: account-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: AccountService
    ports:
      - "5433:5432"
    volumes:
      - account_db_data:/var/lib/postgresql

  transaction-db:
    image: postgres:18
    container_name: transaction-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: TransactionService
    ports:
      - "5434:5432"
    volumes:
      - transaction_db_data:/var/lib/postgresql

volumes:
  account_db_data:
  transaction_db_data: